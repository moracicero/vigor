<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tienda | Vigor</title>
  <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

<header class="container header">
  <div class="logo">Vigor</div>
  <nav class="nav">
    <a href="/">Inicio</a>
    <a href="/servicios">Servicios</a>
    <a href="/tienda">Tienda</a>
    <a href="/contacto">Contacto</a>
  </nav>
</header>

<main class="container">
  <h1>Tienda</h1>
  <p class="muted">Elegí tu plan. Start/Intermediate permiten seleccionar objetivo.</p>

  <section class="grid">
    <article class="card" th:each="p : ${planes}">
      <div th:if="${p.destacado}" style="margin-bottom:10px;">
        <span class="btn btn--primary" style="padding:6px 10px; border-radius:999px;">Recomendado</span>
      </div>

      <h3 th:text="${p.nombre}">Plan</h3>
      <p class="muted" th:text="${p.descripcion}">Descripción</p>

      <p style="margin:10px 0; font-weight:700;">
        <span th:if="${p.precioUsd != null}" th:text="'USD ' + ${p.precioUsd}">USD</span>
        <span th:if="${p.precioUsd == null}">A consultar</span>
        <span class="muted" th:if="${p.duracionSemanas != null}" th:text="' · ' + ${p.duracionSemanas} + ' semanas'"></span>
      </p>

      <div th:if="${p.objetivos != null}">
        <label class="muted" style="display:block; margin-bottom:6px;">Elegí tu objetivo</label>
        <select style="width:100%; padding:10px; border-radius:12px; border:1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.03); color: #e8e8ea;">
          <option th:each="o : ${#strings.arraySplit(p.objetivos, '\\|')}"
                  th:text="${o}">
          </option>
        </select>
      </div>

      <ul class="list" style="margin-top:12px;">
        <li th:each="i : ${#strings.arraySplit(p.incluye, '\\|')}" th:text="${i}"></li>
      </ul>

      <div style="margin-top:14px;">
        <a class="btn btn--primary"
   th:href="@{/contacto(plan=${p.codigo})}"
   th:text="${p.ctaTexto}">
  CTA
</a>
      </div>
    </article>
  </section>
</main>

<footer class="container footer">
  <p class="muted">© <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}"></span> Vigor</p>
</footer>

</body>
</html>
